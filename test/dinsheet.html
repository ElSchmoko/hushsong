<!doctype html><meta charset="utf-8"><style>body{background:#fff6dc;font:12px monospace;margin:6px}.row{display:flex;gap:3px;flex-wrap:wrap}.cell{background:#c8ee9a;padding:1px;text-align:center}canvas{display:block}</style><div id="out" class="row"></div>
<script>window.H={};</script><script src="../src/data.js"></script><script src="../src/engine.js"></script><script src="../src/art-core.js"></script><script src="../src/art-pets.js"></script><script src="../src/art-pets2.js"></script><script src="../src/art-din.js"></script>
<script>H.Art.k=1;const out=document.getElementById('out');for(const key of ['racket','hiss','croak','bash','peck','crackle','beep','squeal','whoosh','squawk','cuckoo','ringtone']){const px=48*5,src=H.Art.sprite(key,'',px),c=document.createElement('canvas');c.width=c.height=px;const x=c.getContext('2d');x.translate(px,0);x.scale(-1,1);x.drawImage(src,0,0);const e=document.createElement('div');e.className='cell';e.appendChild(c);e.appendChild(document.createTextNode(key));out.appendChild(e);}</script>
