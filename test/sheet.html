<!doctype html><meta charset="utf-8">
<style>body{background:#bfe9ff;color:#2b2140;font:11px monospace;margin:8px}
.grid{display:flex;flex-wrap:wrap;gap:4px}.cell{background:#c8ee9a;padding:2px;text-align:center}canvas{display:block}</style>
<div id="out" class="grid"></div>
<script>window.H={};</script>
<script src="../src/data.js"></script><script src="../src/engine.js"></script><script src="../src/art-core.js"></script><script src="../src/art-pets.js"></script><script src="../src/art-pets2.js"></script><script src="../src/art-din.js"></script><script src="../src/art-ui.js"></script>
<script>
const q=new URLSearchParams(location.search); const filter=q.get('f'); const S=+(q.get('s')||3); H.Art.k=1;
const out=document.getElementById('out');
for(const key of Object.keys(H.Art.defs)){ if(filter && !new RegExp(filter).test(key)) continue;
  const d=H.Art.defs[key], px=d.size*S, src=H.Art.sprite(key,q.get('v')||'',px); const c=document.createElement('canvas'); c.width=c.height=px; c.getContext('2d').drawImage(src,0,0);
  const el=document.createElement('div'); el.className='cell'; el.appendChild(c); el.appendChild(document.createTextNode(key)); out.appendChild(el); }
document.title='ready';
</script>
