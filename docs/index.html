/* Hushsong — sticker-ink look. Sizes are in layout units: --u is how many CSS pixels one unit is on this screen. */
#app { --ink: #2b2140; --dim: #5a5270; --paper: #ffffff; --cream: #fff6dc; --sun: #ffe9a8; --line: #d9d2ea;
  --go: #2ecb6e; --go-d: #1f9c54; --gold: #ffc928; --gold-d: #d99a12; --coral: #ff6b5e; --coral-d: #d8433a; --sky: #8fd4ff; --sky-d: #5aa8e0; --bad: #c8213a; --good: #14803f; --blue: #2466c9;
  --f-display: 'Baloo 2', 'Nunito', system-ui, sans-serif; --f-body: 'Nunito', system-ui, sans-serif;
  position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #ffd97a;
  background-image: radial-gradient(#ffe9a8 22%, transparent 24%); background-size: 28px 28px; color: var(--ink); font-family: var(--f-body); font-weight: 700; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#game { --b: calc(var(--u) * 1.5); position: relative; width: calc(var(--u) * var(--w)); height: calc(var(--u) * var(--h)); background: var(--sun); overflow: hidden; font-size: calc(var(--u) * 7); line-height: 1.3; }
#app.framed #game { border: var(--b) solid var(--ink); border-radius: calc(var(--u) * 12); box-shadow: 0 calc(var(--u) * 3) 0 var(--ink); }
#screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
#game * { box-sizing: border-box; } :where(#game) button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; text-align: inherit; } :where(#game) button:disabled { cursor: default; }
#game button:focus-visible { outline: calc(var(--u) * 1.5) solid var(--blue); outline-offset: var(--u); }
canvas.art { display: block; flex: none; } canvas.bob { animation: bob 1.6s ease-in-out infinite; transform-origin: 50% 90%; } canvas.bgc { display: block; }
@keyframes bob { 50% { transform: scale(1.03, 0.97); } }
.col { display: flex; flex-direction: column; gap: calc(var(--u) * 3); } .row { display: flex; align-items: center; gap: calc(var(--u) * 3); } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; } .between { justify-content: space-between; } .center { justify-content: center; text-align: center; }
.pad { padding: calc(var(--u) * 5); display: flex; flex-direction: column; gap: calc(var(--u) * 4); } .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
.small { font-size: calc(var(--u) * 6.4); } .dim { color: var(--dim); } .good { color: var(--good); } .bad { color: var(--bad); }
.label { font-size: calc(var(--u) * 6.4); letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim); }
.disp { font-family: var(--f-display); font-weight: 800; font-size: calc(var(--u) * 11); line-height: 1.05; } .disp.big { font-size: calc(var(--u) * 15); } .disp.huge { font-size: calc(var(--u) * 24); }
.card0, .panel { background: var(--paper); border: var(--b) solid var(--ink); border-radius: calc(var(--u) * 8); box-shadow: 0 calc(var(--u) * 2) 0 var(--ink); }
.panel { padding: calc(var(--u) * 4); }

/* buttons */
.key { --face: var(--paper); display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 2); min-height: calc(var(--u) * 22); padding: 0 calc(var(--u) * 5); background: var(--face) !important; border: var(--b) solid var(--ink) !important; border-radius: calc(var(--u) * 7); box-shadow: 0 calc(var(--u) * 2) 0 var(--ink); font-family: var(--f-display) !important; font-weight: 800; font-size: calc(var(--u) * 9); line-height: 1; text-align: center !important; white-space: nowrap; transition: transform 0.06s, box-shadow 0.06s; }
.key:active:not(:disabled) { transform: translateY(calc(var(--u) * 1.5)); box-shadow: 0 calc(var(--u) * 0.5) 0 var(--ink); }
.key:disabled { --face: #eeeaf5 !important; color: #8a84a0 !important; border-color: #8a84a0 !important; box-shadow: none; }
.key.go { --face: var(--go); } .key.gold { --face: var(--gold); } .key.coral { --face: var(--coral); } .key.blue { --face: var(--sky); } .key.soft { --face: var(--cream); }
.key.big { min-height: calc(var(--u) * 30); font-size: calc(var(--u) * 14); border-radius: calc(var(--u) * 9); } .key.sm { min-height: calc(var(--u) * 22); min-width: calc(var(--u) * 22); padding: 0 calc(var(--u) * 3); font-size: calc(var(--u) * 7); border-radius: calc(var(--u) * 6); } .key.wide { width: 100%; }

.chip { display: inline-flex; align-items: center; gap: calc(var(--u) * 1.5); padding: calc(var(--u) * 0.5) calc(var(--u) * 3) calc(var(--u) * 0.5) calc(var(--u) * 1.5); background: var(--paper); border: calc(var(--u) * 1) solid var(--ink); border-radius: calc(var(--u) * 5); font-size: calc(var(--u) * 6.4); font-weight: 800; white-space: nowrap; }

  /* ----- the band's parts ----- */

  const PROG = {

  /* ----- battle themes (themes.js): written tunes the band plays as far as it can ----- */

  // Encore: after a won wave, go on or stop; after a lost one, the run is over
  UI.encoreResult = (out) => {

  };
  UI.result = (out) => {
    if (out.encore) return UI.encoreResult(out);
    if (out.daily) return UI.dailyResult(out);
    if (out.solo) return UI.soloResult(out);

    const loot = () => { const r = box('loot'); if (out.notes) r.appendChild(UI.purse('ic_note', '+' + out.notes)); if (out.xp) r.appendChild(UI.purse('ic_xp', '+' + out.xp)); if (out.shells && !out.giftShell) r.appendChild(UI.purse('ic_shell', '+' + out.shells)); if (out.echo && !out.story) r.appendChild(UI.purse('ic_echo', '+' + out.echo + (out.echo === 1 ? ' echo' : ' echoes'))); return r; };
    const evo = H.canEvolveAny(S), evoKey = () => UI.key((H.nextForms(evo).length ? 'Evolve ' : 'Add a star to ') + H.FORMS[evo.form].n, () => UI.go('pet', { id: evo.id, n: nx, back: out.reh ? 'rehearsal' : 'team' }), 'gold wide');

        team.forEach((p, i) => { const c = UI.sp(p.form, team.length === 1 || i === 1 ? 1.05 : 0.9, { anim: false }); c.style.setProperty('--d', i * 0.09 + 's'); band.appendChild(c); });
        add(lv, el('div', 'rays'), band, add(el('div', 'lvbadge'), el('small', '', 'Level up'), el('b', '', String(S.level))));
        for (let i = 0; i < 14; i++) { const s = el('i', 'spark'), a = (i / 14) * 6.283; s.style.left = '50%'; s.style.top = '34%'; s.style.setProperty('--x', Math.cos(a) * (60 + (i % 3) * 22) + '%'); s.style.setProperty('--y', Math.sin(a) * (110 + (i % 2) * 40) + '%'); s.style.animationDelay = 0.15 + (i % 4) * 0.05 + 's'; lv.appendChild(s); }
        kids.push(lv); if (out.ups > 1) kids.push(txt('center good', `<b>+${out.ups} levels!</b>`));
        const un = UI.unlockNote(out.ups); if (un) kids.push(un);
        if (!window.__hsSpeed) setTimeout(() => Au.sfx('level'), 850);
      }
      kids.push(box('row', txt('small dim', 'Next level'), add(el('div', 'grow'), UI.meter(S.xp / H.xpNeed(S.level))))); };
    const gold = () => { if (!H.recordsReady(S)) return false; const b = UI.key('', () => UI.go('records'), 'gold wide'); add(b, UI.icon('ic_record'), 'A record is ready'); kids.push(b); return true; };
    if (out.reh) {
      // a rehearsal: an echo the first time, practice after that
      if (out.win) {
        kids.push(txt('disp big center', 'Rehearsal done!'), loot());
        levelUp(); gold(); if (evo) kids.push(evoKey());
        kids.push(UI.key('More rehearsals', () => UI.go('rehearsal'), 'go wide big'), UI.key('Home', () => UI.go('home'), 'wide soft'));
      } else {
        kids.push(txt('disp big center', 'Not this time'), txt('center dim', 'Nothing is lost.'), loot());
        kids.push(UI.key('Try again', () => UI.go('battle', { n: out.n, reh: 1 }), 'go wide big'), UI.key('Rehearsals', () => UI.go('rehearsal'), 'wide soft'));
      }
      UI.modal(...kids); return;
    }
    if (out.win) {
      kids.push(txt('disp big center', out.boss ? 'Boss beaten!' : 'Floor cleared!'), loot());
      levelUp();
      if (!out.first) kids.push(txt('small dim center', 'Replays pay no notes.'));
      if (out.item && !out.gift) kids.push(txt('label center', 'You found'), UI.itemRow(out.item));
      // some wins lead somewhere first: the story after a boss, or the first shell and first piece of equipment
      if (out.story) kids.push(UI.key('Continue', () => UI.go('story', { region: out.region, n: out.n, shells: out.shells, echo: out.bossEcho || 0, legend: out.legend ? out.legend.id : 0 }), 'go wide big'));

  };
