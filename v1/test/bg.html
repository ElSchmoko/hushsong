<script>const o=document.getElementById('o');for(const k of ['fen','works','ridge','hall','camp'])for(const m of [0,1]){const s=H.Art.bg(k,180,140,m);const c=document.createElement('canvas');c.width=360;c.height=280;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(s,0,0,360,280);

o.appendChild(c);}</script>
